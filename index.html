<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: fixed;
            z-index: -10;
        }

        @font-face {
            font-family: 'ScaryFont';
            src: url('fonts/HelpMe.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        #ui {
            position: absolute;
            font-family: 'ScaryFont';
            /* 位置固定を有効にする */
            top: 10px;
            /* 画面上部からの余白 */
            left: 10px;
            /* 画面左側からの余白 */
            z-index: 10;
            /* Canvasより手前に出す */
            color: white;
            /* 背景が暗い場合に見えやすくする（任意） */
            /* フォント（任意） */
            font-size: 24px;
            /* 文字サイズ（任意） */
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <div id="ui">
        <p id="timeDisp">Minutes</p>
        <p id="daysDisp">Days</p>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { Text } from 'troika-three-text';

        import parkingTextureURL from "./images/parking-texture.png";
        import skyURL from "./images/sky.png";
        import brickTextureURL from "./images/brick.png";
        import lightBrickURL from "./images/light-brick.png";
        import grassURL from "./images/grass.png";

        const clock = new THREE.Clock();

        const scene = new THREE.Scene();
        const timeDisp = document.getElementById("timeDisp");
        const daysDisp = document.getElementById("daysDisp");

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // materials
        const tl = new THREE.TextureLoader();
        const parkingTexture = tl.load(parkingTextureURL);
        parkingTexture.wrapS = THREE.RepeatWrapping;
        parkingTexture.wrapT = THREE.RepeatWrapping;
        parkingTexture.repeat.set(40, 40);
        const parkingMaterial = new THREE.MeshStandardMaterial({ map: parkingTexture, roughness: 0.5 });
        // // sky
        const skyTexture = tl.load(skyURL);
        // // brick
        const brickTexture = tl.load(brickTextureURL);
        brickTexture.wrapS = THREE.RepeatWrapping;
        brickTexture.wrapT = THREE.RepeatWrapping;
        brickTexture.repeat.set(4, 4);
        const brickMat = new THREE.MeshStandardMaterial({ map: brickTexture, roughness: 1 });

        const lightBrickTexture = tl.load(lightBrickURL);
        lightBrickTexture.wrapS = THREE.RepeatWrapping;
        lightBrickTexture.wrapT = THREE.RepeatWrapping;
        lightBrickTexture.repeat.set(4, 4);
        const lightBrickMat = new THREE.MeshStandardMaterial({ map: lightBrickTexture, roughness: 1 });
        // // grass
        const grassTexture = tl.load(grassURL);
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.repeat.set(30, 30);
        const grassMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 100 });

        scene.background = skyTexture;

        const groundGeo = new THREE.BoxGeometry(400, 400, 0.05);
        const green = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const ground = new THREE.Mesh(groundGeo, parkingMaterial);
        scene.add(ground);

        const grass = new THREE.Mesh(new THREE.BoxGeometry(1000, 1000, 0.05), grassMat);
        grass.position.set(0, 0, -0.05);
        scene.add(grass);

        const playerMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

        // ライト
        const lightBulb1 = new THREE.PointLight(0xffffff, 60, 1000, 2);
        lightBulb1.position.set(10, 150, 40)
        scene.add(lightBulb1);
        const lightBulb2 = new THREE.PointLight(0xffffff, 60, 1000, 2);
        lightBulb2.position.set(10, 80, 40)
        scene.add(lightBulb2);

        const ambientLight = new THREE.AmbientLight(0xffffff);
        //scene.add(ambientLight);

        const light2 = new THREE.DirectionalLight(0xffffff, 1);
        light2.position.set(0, -7, 10)
        scene.add(light2);

        // 世界ヴァロ
        const gravity = -0.1;
        const groundY = 0;
        const dayLength = 60;


        // key pressed
        let ePressed = false;

        const stages = {
            daytime: true,
            nighttime: false,
        }
        class Player {
            constructor(x, y, z, mat) {
                this.movement = {
                    forward: false,
                    backward: false,
                    left: false,
                    right: false,
                    rotateL: false,
                    rotateR: false,
                }

                this.tiltingLeft = false;

                this.dx = 0;
                this.dy = 0;
                this.dz = 0;
                this.speed = 0.5;
                this.rotationSpeed = 0.1;
                this.geo = new THREE.BoxGeometry(1, 1, 5);
                this.mesh = new THREE.Mesh(this.geo, mat);
                this.mesh.position.set(x, y, z);
                scene.add(this.mesh);
                this.prevMeshPos = this.mesh.position;

                this.mesh.add(camera);
                this.mesh.position.z = 1;
                camera.position.set(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z + 0.01);
                camera.rotation.x = Math.PI / 2;
            }

            update() {
                this.prevMeshPos = this.mesh.position.clone();
                this.dz += gravity;
                this.mesh.position.z += this.dz;
                this.mesh.translateX(this.dx);
                this.mesh.translateY(this.dy);


                // key inputs
                if (this.movement.forward) {
                    this.dy = this.speed;
                    if (this.mesh.rotation.y > -0.05 && this.tiltingLeft == true) {
                        this.mesh.rotation.y -= 0.005;
                        if (this.mesh.rotation.y <= -0.04) {
                            this.tiltingLeft = false;
                        }
                    } else if (this.mesh.rotation.y < 0.05 && !this.tiltingLeft) {
                        this.mesh.rotation.y += 0.005;
                        if (this.mesh.rotation.y >= 0.04) {
                            this.tiltingLeft = true;
                        }
                    }
                }
                if (this.movement.backward) {
                    this.dy = -this.speed;

                    if (this.mesh.rotation.y > -0.05 && this.tiltingLeft == true) {
                        this.mesh.rotation.y -= 0.005;
                        if (this.mesh.rotation.y <= -0.04) {
                            this.tiltingLeft = false;
                        }
                    } else if (this.mesh.rotation.y < 0.05 && !this.tiltingLeft) {
                        this.mesh.rotation.y += 0.005;
                        if (this.mesh.rotation.y >= 0.04) {
                            this.tiltingLeft = true;
                        }
                    }
                }
                if (this.movement.left) {
                    this.dx = -this.speed;
                }
                if (this.movement.right) {
                    this.dx = this.speed;
                }
                if (!this.movement.right && !this.movement.left) {
                    this.dx = 0;
                }
                if (!this.movement.forward && !this.movement.backward) {
                    this.dy = 0;
                }

                // rotation key input
                if (this.movement.rotateL) {
                    this.mesh.rotation.z += this.rotationSpeed;
                }
                if (this.movement.rotateR) {
                    this.mesh.rotation.z -= this.rotationSpeed;
                }

                // ground check
                if (this.mesh.position.z <= groundY + 10) {
                    this.mesh.position.z = groundY + 10;
                    this.dz = 0;
                }

            }
        }

        const player = new Player(0, 0, 10, playerMat);

        class Node {
            constructor(name, baseX, baseY) {
                this.name = name;
                this.elements = [];
                this.x = baseX;
                this.y = baseY;
            }

            addElement(name, x, y, z, width, length, depth, mat) {
                const e = new THREE.BoxGeometry(width, length, depth);
                const m = new THREE.Mesh(e, mat);
                m.position.set(x, y, z);
                scene.add(m);
                this.elements.push({ name: name, mesh: m });
            }

            activateCollisions() {
                for (const e of this.elements) {
                    const eB = new THREE.Box3().setFromObject(e.mesh);
                    const pB = new THREE.Box3().setFromObject(player.mesh);

                    if (eB.intersectsBox(pB)) {
                        player.mesh.position.copy(player.prevMeshPos);
                    }
                }


            }

            getElementByName(name) {
                for (e of this.elements) {
                    if (e.name === name) {
                        return e;
                    }
                }
            }
        }

        const building = new Node("building", 100, 100);
        building.addElement("wall1", -10, 50, 0, 25, 5, 50, brickMat);
        building.addElement("wall1", 30, 50, 0, 25, 5, 50, brickMat);
        building.addElement("wall1", 10, 50, 35, 65, 5, 20, brickMat);
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 50), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        scene.add(doorMesh);
        doorMesh.position.set(10, 50, 0);
        const black = new THREE.MeshStandardMaterial({ color: 0x000000 });

        building.addElement("wall2", -40, 52, 0, 50, 2, 95, lightBrickMat);
        building.addElement("wall2", 50, 52, 0, 50, 2, 95, lightBrickMat);
        building.addElement("wall3", -60, 127, 0, 2, 150, 95, lightBrickMat);
        building.addElement("wall4", 75, 127, 0, 2, 150, 95, lightBrickMat);
        building.addElement("wall5", 5, 200, 0, 140, 2, 95, new THREE.MeshStandardMaterial({ color: 0x000000 }));
        building.addElement("ceiling1", 10, 125, 45, 150, 150, 2, brickMat);
        building.addElement("floor1", 10, 125, 0.02, 150, 150, 2, new THREE.MeshStandardMaterial({ color: 0x000000 }));
        building.addElement("counter", 10, 150, 8, 30, 8, 8, black);

        document.addEventListener("keydown", (e) => {
            switch (e.key) {
                case "w":
                    player.movement.forward = true;
                    break;
                case "s":
                    player.movement.backward = true;
                    break;
                case "a":
                    player.movement.left = true;
                    break;
                case "d":
                    player.movement.right = true;
                    break;
                case "ArrowLeft":
                    player.movement.rotateL = true;
                    break;
                case "ArrowRight":
                    player.movement.rotateR = true;
                    break;
                case "e":
                    ePressed = true;
                    break;

            }
        });

        document.addEventListener("keyup", (event) => {
            switch (event.key) {
                case "w":
                    player.movement.forward = false;
                    break;
                case "s":
                    player.movement.backward = false;
                    break;
                case "a":
                    player.movement.left = false;
                    break;
                case "d":
                    player.movement.right = false;
                    break;
                case "ArrowLeft":
                    player.movement.rotateL = false;
                    break;
                case "ArrowRight":
                    player.movement.rotateR = false;
                    break;
                case "e":
                    ePressed = false;
                    break;

            }
        });

        function handleBackgroundChange(timeInDays) {
            if (Math.trunc(timeInDays) % 2 == 1) {
                if (scene.backgroundIntensity > 0) {
                    scene.backgroundIntensity -= 0.01;
                    stages.nighttime = true;
                    stages.daytime = false;
                } else {
                    scene.backgroundIntensity = 0;
                }
            } else if (Math.trunc(timeInDays) % 2 == 0) {
                if (scene.backgroundIntensity < 1) {
                    scene.backgroundIntensity += 0.01;
                    stages.nighttime = false;
                    stages.daytime = true;
                } else {
                    scene.backgroundIntensity = 1;
                }
            }
        }
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            timeDisp.textContent = "Minutes Passed: " + Math.trunc(elapsedTime);
            const days = elapsedTime / 5;
            daysDisp.textContent = "Hours Passed: " + Math.trunc(days);

            player.update();
            building.activateCollisions();

            // random light flickers
            const rand = Math.random();
            if (rand > 0.7) {
                lightBulb1.visible = false;
            } else if (rand > 0.3) {
                lightBulb1.visible = true;
            } else if (rand > 0.1) {
                lightBulb1.visible = false;
            }
            const rand2 = Math.random();
            if (rand2 > 0.7) {
                lightBulb2.visible = false;
            } else if (rand2 > 0.3) {
                lightBulb2.visible = true;
            } else if (rand2 > 0.1) {
                lightBulb2.visible = false;
            }
            handleBackgroundChange(days);

            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>

</html>
